name: Publish durable readiness proof

on:
  workflow_dispatch:
    inputs:
      proof_run_id:
        description: "Successful Publish phase readiness proof run ID"
        required: true
        type: string
      phase:
        description: "Accepted phase recorded by the proof"
        required: true
        type: choice
        options: [accounting, sunday]
      decision_run_id:
        description: "Decision-support workflow run ID recorded by the proof"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: durable-readiness-proof-${{ inputs.phase }}-${{ inputs.decision_run_id }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve exact proof run and artifact
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
          PHASE: ${{ inputs.phase }}
          DECISION_RUN_ID: ${{ inputs.decision_run_id }}
        run: |
          set -euo pipefail
          [[ "$PROOF_RUN_ID" =~ ^[0-9]+$ && "$DECISION_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Run IDs must be numeric" >&2
            exit 2
          }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}" \
            > "$RUNNER_TEMP/proof-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .head_repository.full_name == $repo and
            .head_branch == "main" and
            .path == ".github/workflows/publish-readiness-proof.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success"
          ' "$RUNNER_TEMP/proof-run.json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PROOF_RUN_ID}/artifacts" \
            > "$RUNNER_TEMP/proof-artifacts.json"
          expected_name="readiness-proof-${PHASE}-${DECISION_RUN_ID}"
          artifact_count="$(jq --arg name "$expected_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            "$RUNNER_TEMP/proof-artifacts.json")"
          [[ "$artifact_count" == "1" ]] || {
            echo "Expected one unexpired proof artifact named $expected_name" >&2
            exit 2
          }
          artifact_id="$(jq -r --arg name "$expected_name" \
            '.artifacts[] | select(.name == $name and .expired == false) | .id' \
            "$RUNNER_TEMP/proof-artifacts.json")"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download exact proof artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.proof.outputs.artifact_id }}
          path: ${{ runner.temp }}/proof
          repository: ${{ github.repository }}
          run-id: ${{ inputs.proof_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Validate proof identity and resolve decision artifact
        id: decision
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
          DECISION_RUN_ID: ${{ inputs.decision_run_id }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof/readiness-proof.json"
          [[ -f "$proof" && ! -L "$proof" ]] || {
            echo "Proof artifact does not contain a regular readiness-proof.json" >&2
            exit 2
          }
          jq -e --arg phase "$PHASE" --argjson decision_run "$DECISION_RUN_ID" '
            .schema_version == "1.0.0" and
            .status == "PHASE_USABLE_PROOF" and
            .phase == $phase and
            (.phase_transition.to == "READY" or .phase_transition.to == "DEGRADED") and
            .phase_transition.operating_mode == "BENCHMARK_ONLY_SAFE" and
            .decision_support.workflow_run_id == $decision_run and
            .exact_validator_result.status == "VALID" and
            .exact_validator_result.phase_evaluation.status == "USABLE" and
            .exact_validator_result.phase_evaluation.phase_id == $phase and
            ([.tests[]] | all(. == "PASS"))
          ' "$proof" >/dev/null
          decision_artifact_id="$(jq -r '.decision_support.artifact_id' "$proof")"
          decision_commit="$(jq -r '.decision_support.producer_commit' "$proof")"
          [[ "$decision_artifact_id" =~ ^[0-9]+$ ]] || exit 2
          [[ "$decision_commit" =~ ^[0-9a-f]{40}$ ]] || exit 2
          echo "artifact_id=$decision_artifact_id" >> "$GITHUB_OUTPUT"
          echo "commit=$decision_commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact decision producer and validator commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.decision.outputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: requirements-market-data.txt

      - name: Install reviewed dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-market-data.txt

      - name: Download exact accepted decision artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.decision.outputs.artifact_id }}
          path: staging/decision
          repository: ${{ github.repository }}
          run-id: ${{ inputs.decision_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Revalidate exact proof decision and phase-window terminology
        id: evidence
        shell: bash
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/proof/readiness-proof.json"
          pack="staging/decision/phase-packs/${PHASE}.json"
          as_of="$(jq -r '.exact_validator_result.phase_evaluation.as_of_utc' "$proof")"
          validator_args=(
            python verify-decision-support.py
            --dist staging/decision
            --phase "$PHASE"
            --as-of "$as_of"
          )
          if [[ "$PHASE" == "sunday" ]]; then
            validator_args+=(--allow-degraded)
          fi
          "${validator_args[@]}" > "$RUNNER_TEMP/exact-phase-result.json"
          jq -e '.phase_evaluation.status == "USABLE"' \
            "$RUNNER_TEMP/exact-phase-result.json" >/dev/null
          python - "$proof" "$pack" <<'PY'
          import json
          import sys
          from datetime import datetime

          proof = json.load(open(sys.argv[1], encoding="utf-8"))
          pack = json.load(open(sys.argv[2], encoding="utf-8"))
          evaluation = proof["exact_validator_result"]["phase_evaluation"]
          as_of = datetime.fromisoformat(evaluation["as_of_utc"].replace("Z", "+00:00"))
          not_before = datetime.fromisoformat(pack["not_before_utc"].replace("Z", "+00:00"))
          expires = datetime.fromisoformat(pack["expires_at_utc"].replace("Z", "+00:00"))
          if not not_before <= as_of <= expires:
              raise SystemExit("Proof as_of_utc is outside the inclusive phase window")
          if evaluation.get("active_window_id") != pack["phase_windows"][0]["window_id"]:
              raise SystemExit("Proof active window does not match the phase pack")
          PY
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
          echo "cutoff=$(jq -r '.phase_decision_cutoff_utc' "$pack")" >> "$GITHUB_OUTPUT"
          echo "not_before=$(jq -r '.not_before_utc' "$pack")" >> "$GITHUB_OUTPUT"
          echo "expires=$(jq -r '.expires_at_utc' "$pack")" >> "$GITHUB_OUTPUT"

      - name: Build content-addressed durable bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p durable
          cp "$RUNNER_TEMP/proof/readiness-proof.json" durable/readiness-proof.json
          proof_sha="$(sha256sum durable/readiness-proof.json | awk '{print $1}')"
          printf '%s  readiness-proof.json\n' "$proof_sha" \
            > durable/readiness-proof.json.sha256
          (cd durable && sha256sum -c readiness-proof.json.sha256)
          echo "proof_sha=$proof_sha" >> "$GITHUB_OUTPUT"

      - name: Publish or reverify atomic content-addressed Git record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_SHA: ${{ steps.bundle.outputs.proof_sha }}
        run: |
          set -euo pipefail
          record_dir="audit/readiness-proofs/${PROOF_SHA}"
          proof_path="${record_dir}/readiness-proof.json"
          sidecar_path="${record_dir}/readiness-proof.json.sha256"
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${proof_path}?ref=main" \
            > "$RUNNER_TEMP/existing-proof.json" 2>/dev/null
          then
            gh api "repos/${GITHUB_REPOSITORY}/contents/${sidecar_path}?ref=main" \
              > "$RUNNER_TEMP/existing-sidecar.json"
            jq -r '.content' "$RUNNER_TEMP/existing-proof.json" | base64 -d \
              > "$RUNNER_TEMP/existing-readiness-proof.json"
            jq -r '.content' "$RUNNER_TEMP/existing-sidecar.json" | base64 -d \
              > "$RUNNER_TEMP/existing-readiness-proof.json.sha256"
            cmp durable/readiness-proof.json \
              "$RUNNER_TEMP/existing-readiness-proof.json"
            cmp durable/readiness-proof.json.sha256 \
              "$RUNNER_TEMP/existing-readiness-proof.json.sha256"
            durable_commit="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits?path=${proof_path}&per_page=1" \
              --jq '.[0].sha')"
          else
            proof_blob="$(base64 -w0 durable/readiness-proof.json | \
              jq -R '{content: ., encoding: "base64"}' | \
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/blobs" \
                --input - --jq '.sha')"
            sidecar_blob="$(base64 -w0 durable/readiness-proof.json.sha256 | \
              jq -R '{content: ., encoding: "base64"}' | \
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/git/blobs" \
                --input - --jq '.sha')"
            published=false
            for attempt in 1 2 3 4; do
              base_commit="$(gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha')"
              base_tree="$(gh api \
                "repos/${GITHUB_REPOSITORY}/git/commits/${base_commit}" \
                --jq '.tree.sha')"
              tree_sha="$(jq -n \
                --arg base_tree "$base_tree" \
                --arg proof_path "$proof_path" \
                --arg proof_blob "$proof_blob" \
                --arg sidecar_path "$sidecar_path" \
                --arg sidecar_blob "$sidecar_blob" \
                '{
                  base_tree: $base_tree,
                  tree: [
                    {path: $proof_path, mode: "100644", type: "blob", sha: $proof_blob},
                    {path: $sidecar_path, mode: "100644", type: "blob", sha: $sidecar_blob}
                  ]
                }' | gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/trees" \
                  --input - --jq '.sha')"
              durable_commit="$(jq -n \
                --arg message "Preserve readiness proof ${PROOF_SHA}" \
                --arg tree "$tree_sha" \
                --arg parent "$base_commit" \
                '{message: $message, tree: $tree, parents: [$parent]}' | \
                gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/git/commits" \
                  --input - --jq '.sha')"
              if jq -n --arg sha "$durable_commit" \
                '{sha: $sha, force: false}' | \
                gh api --method PATCH \
                  "repos/${GITHUB_REPOSITORY}/git/refs/heads/main" \
                  --input - >/dev/null
              then
                published=true
                break
              fi
            done
            [[ "$published" == "true" ]] || {
              echo "Could not atomically publish proof after four main-ref races" >&2
              exit 2
            }
          fi
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/${proof_path}?ref=${durable_commit}" \
            --jq '.content' | base64 -d > "$RUNNER_TEMP/published-proof.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/${sidecar_path}?ref=${durable_commit}" \
            --jq '.content' | base64 -d > "$RUNNER_TEMP/published-proof.json.sha256"
          cmp durable/readiness-proof.json "$RUNNER_TEMP/published-proof.json"
          cmp durable/readiness-proof.json.sha256 \
            "$RUNNER_TEMP/published-proof.json.sha256"
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          [[ "$latest_tag" =~ ^market-data-[0-9]{8}T[0-9]{6}Z$ ]] || {
            echo "Durable proof changed canonical release discovery" >&2
            exit 2
          }
          echo "Durable proof commit: https://github.com/${GITHUB_REPOSITORY}/commit/${durable_commit}"
